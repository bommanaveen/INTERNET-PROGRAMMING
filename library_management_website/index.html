<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libra — Library Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="Libra home"><span class="brand-mark">L</span><span>libra<span class="brand-dot">.</span><small>LIBRARY PORTAL</small></span></a>
      <div class="side-label">WORKSPACE</div>
      <nav id="navigation">
        <button class="nav-link active" data-page="dashboard"><span>▦</span> Overview</button>
        <button class="nav-link" data-page="catalog"><span>▤</span> Book catalog</button>
        <button class="nav-link" data-page="borrowings"><span>↗</span> My borrowings</button>
        <button class="nav-link" data-page="materials"><span>▣</span> Study materials</button>
        <button class="nav-link" data-page="fines"><span>₹</span> Fines <span class="nav-count" id="fineCount">0</span></button>
        <button class="nav-link" data-page="profile"><span>◉</span> My profile</button>
      </nav>
      <div class="side-label admin-label">LIBRARIAN</div>
      <nav>
        <button class="nav-link admin-only" data-page="manage-books"><span>＋</span> Manage books</button>
        <button class="nav-link admin-only" data-page="issue-book"><span>⇄</span> Issue / return</button>
        <button class="nav-link admin-only" data-page="manage-materials"><span>▧</span> Manage materials</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">?</div><strong>Need a hand?</strong><p>Contact the library team for help with your account.</p><button class="text-button" data-page="contact">Contact support <span>→</span></button></div>
        <div class="side-footer">© 2026 Libra Library</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="menuToggle" aria-label="Toggle menu">☰</button>
        <div class="breadcrumb"><span>Library Portal</span><b>/</b><strong id="breadcrumbTitle">Overview</strong></div>
        <div class="top-actions">
          <span class="status-pill"><i></i> Library open</span>
          <button class="icon-button" id="notificationBtn" aria-label="Notifications">♧<span class="notification-dot"></span></button>
          <div class="user-chip"><div class="avatar" id="topAvatar">SN</div><div><strong id="topName">Student Name</strong><small id="topRole">Student account</small></div><button id="logoutBtn" class="logout-btn" title="Switch account">⌄</button></div>
        </div>
      </header>

      <section class="page-content" id="pageContent"></section>
      <footer class="page-footer"><span>Made for curious minds.</span><span>Privacy · Help · Library policies</span></footer>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">LIBRARY PORTAL</p><h2 id="modalTitle">Welcome back</h2></div><button class="close-modal" id="closeModal" aria-label="Close">×</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
